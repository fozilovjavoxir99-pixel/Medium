<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DARE LUX | Men's Fashion</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
background:#101010;
color:white;
font-family:Arial,sans-serif;
}
header{
padding:25px;
text-align:center;
border-bottom:1px solid #b99a58;
}
.logo{
color:#d6b66b;
font-size:32px;
letter-spacing:6px;
font-weight:bold;
}
.hero{
text-align:center;
padding:90px 20px;
}
h1{
font-size:42px;
color:#d6b66b;
}
.hero p{color:#ccc}
button{
background:#d6b66b;
border:0;
padding:15px 30px;
font-weight:bold;
}
.products{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
padding:25px;
}
.card{
background:#202020;
padding:25px;
width:260px;
text-align:center;
border:1px solid #806b40;
}
.card h2{color:#d6b66b}
footer{
text-align:center;
padding:30px;
color:#aaa;
}
</style>
</head>
<body>
<header>
<div class="logo">DARE LUX</div>
<p>PREMIUM MEN'S FASHION</p>
</header>

<section class="hero">
<h1>STYLE IS YOUR IDENTITY</h1>
<p>Замонавий эркаклар учун премиум кийимлар.</p>
<button>OUR COLLECTION</button>
</section>

<section class="products">
<div class="card">
<h2>CLASSIC</h2>
<p>Классик костюмлар ва шимлар</p>
</div>
<div class="card">
<h2>CASUAL</h2>
<p>Кундалик замонавий кийимлар</p>
</div>
<div class="card">
<h2>ACCESSORIES</h2>
<p>Эркаклар аксессуарлари</p>
</div>
</section>

<footer>
DARE LUX © 2026
</footer>
</body>
</html>
